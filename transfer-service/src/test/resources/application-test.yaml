spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    hikari:
      connection-init-sql: "CREATE SCHEMA IF NOT EXISTS transfer_service"
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: transfer_service
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/transfer-service/db.changelog-master.yaml
    default-schema: transfer_service
    drop-first: true
    clear-checksums: true
    liquibase-schema: public
  security:
    oauth2:
      client:
        registration:
          transfer-service:
            client-id: test
            client-secret: test
            provider: keycloak
            scope: openid
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost/dummy/token

management:
  zipkin:
    tracing:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 0
