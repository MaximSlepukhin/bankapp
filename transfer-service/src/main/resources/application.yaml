spring:
  application:
    name: transfer-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: transfer_service

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/transfer-service/db.changelog-master.yaml
    default-schema: transfer_service
    drop-first: true
    clear-checksums: true

