spring:
  application:
    name: transfer-service

  kafka:
    bootstrap-servers: my-kafka.default.svc.cluster.local:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: transfer_service

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/transfer-service/db.changelog-master.yaml
    default-schema: transfer_service
    drop-first: true
    clear-checksums: true

  security:
    oauth2:
      client:
        registration:
          transfer-service:
            client-id: transfer-service
            client-secret: RMU6Vb96Ay0fWnLJ6WEBiyt8yjdjKk24
            provider: keycloak
            scope: openid
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://keycloak:80/realms/bank-realm/protocol/openid-connect/token

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8083
  address: 0.0.0.0
  shutdown: graceful

logging:
  level:
    root: INFO
    com.github.maximslepukhin: INFO
    org.springframework: WARN
    io.github.resilience4j: WARN

resilience4j:
  circuitbreaker:
    instances:
      accountsService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      blockerService:
        slidingWindowSize: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 10s
      exchangeService:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      transferService:
        ignoreExceptions:
          - com.github.maximslepukhin.exception.TransferBlockedException
          - java.lang.IllegalArgumentException
          - org.springframework.transaction.TransactionSystemException
        recordExceptions:
          - java.io.IOException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      accountsService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
  timelimiter:
    instances:
      accountsService:
        timeoutDuration: 3s

management:
  endpoints:
    web:
      exposure:
        include: '*'

  metrics:
    enable:
      all: true

  tracing:
    sampling:
      probability: 1

  zipkin:
    tracing:
      endpoint: http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans
