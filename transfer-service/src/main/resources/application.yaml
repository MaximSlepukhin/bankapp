spring:
  application:
    name: transfer-service

  kafka:
    bootstrap-servers: my-kafka.default.svc.cluster.local:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: transfer_service

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/transfer-service/db.changelog-master.yaml
    default-schema: transfer_service
    drop-first: true
    clear-checksums: true

  security:
    oauth2:
      client:
        registration:
          transfer-service:
            client-id: transfer-service  # ID клиента, который настроен в Keycloak
            client-secret: RMU6Vb96Ay0fWnLJ6WEBiyt8yjdjKk24
            provider: keycloak
            scope: openid
            authorization-grant-type: client_credentials  # Тип авторизации
        provider:
          keycloak:
            token-uri: http://keycloak:80/realms/bank-realm/protocol/openid-connect/token


server:
  port: 8083
  address: 0.0.0.0

logging:
  level:
    io.github.resilience4j: debug
    org.springframework.web: debug
    org.springframework.web.filter.CommonsRequestLoggingFilter: debug
    org.springframework.security: trace
    com.github.maximslepukhin: debug

resilience4j:
  circuitbreaker:
    instances:
      transferService:
        ignoreExceptions:
          - com.github.maximslepukhin.exception.TransferBlockedException
          - java.lang.IllegalArgumentException
          - org.springframework.transaction.TransactionSystemException
        recordExceptions:
          - java.io.IOException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

  metrics:
    enable:
      all: true

  tracing:
    sampling:
      probability: 1

  zipkin:
    tracing:
      endpoint: http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans