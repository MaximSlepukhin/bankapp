<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 12px;
        }

        h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 6px;
        }

        .subtitle {
            color: rgba(255,255,255,0.45);
            font-size: 13px;
            text-align: center;
            margin-bottom: 28px;
        }

        .required-note {
            color: rgba(255,255,255,0.45);
            font-size: 12px;
            margin-bottom: 20px;
        }

        .required-note span { color: #e94560; }

        .error {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.4);
            border-radius: 8px;
            color: #ff6b8a;
            font-size: 13px;
            padding: 10px 14px;
            margin-bottom: 16px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #e94560;
            background: rgba(255,255,255,0.1);
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) opacity(0.5);
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #e94560, #c73652);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.45);
            font-size: 13px;
        }

        .login-link a {
            color: #e94560;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-icon">🏦</div>
        <h1>Создать аккаунт</h1>
        <p class="subtitle">Заполните данные для регистрации</p>
    </div>

    <p class="required-note"><span>*</span> Все поля обязательны для заполнения</p>

    <div th:each="error : ${errors}" class="error" th:text="${error}"></div>

    <form th:action="${'/signup'}" method="post">
        <div class="field">
            <label>Логин</label>
            <input name="login" type="text" th:value="${login}" placeholder="Введите логин" required/>
        </div>
        <div class="field">
            <label>Пароль</label>
            <input name="password" type="password" placeholder="Введите пароль" required/>
        </div>
        <div class="field">
            <label>Повторите пароль</label>
            <input name="confirm_password" type="password" placeholder="Повторите пароль" required/>
        </div>
        <div class="field">
            <label>Фамилия Имя</label>
            <input name="name" type="text" th:value="${name}" placeholder="Иванов Иван" required/>
        </div>
        <div class="field">
            <label>Дата рождения</label>
            <input name="birthdate" type="date" th:value="${birthdate}" required/>
        </div>
        <button type="submit">Зарегистрироваться</button>
    </form>

    <div class="login-link">
        Уже есть аккаунт? <a th:href="@{/oauth2/authorization/keycloak}">Войти</a>
    </div>
</div>
</body>
</html>
