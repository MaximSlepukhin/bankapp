<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', sans-serif;
            color: #ffffff;
            padding: 0 0 40px 0;
        }

        /* ── Навбар ── */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .navbar-brand .icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }

        .navbar-user .username {
            color: #fff;
            font-weight: 600;
        }

        .navbar-actions {
            display: flex;
            gap: 10px;
        }

        .btn-nav {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-nav:hover { opacity: 0.85; transform: translateY(-1px); }

        .btn-outline {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e94560, #c73652);
            color: #fff;
        }

        /* ── Основной контент ── */
        .container {
            max-width: 900px;
            margin: 36px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── Карточки ── */
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px 28px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: rgba(255,255,255,0.9);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .dot {
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, #e94560, #c73652);
            border-radius: 2px;
        }

        /* ── Ошибки ── */
        .error-list {
            margin-bottom: 14px;
        }

        .error {
            background: rgba(233,69,96,0.15);
            border: 1px solid rgba(233,69,96,0.4);
            border-radius: 8px;
            color: #ff6b8a;
            font-size: 13px;
            padding: 8px 12px;
            margin-bottom: 6px;
        }

        /* ── Сетка полей ── */
        .row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 140px;
        }

        .field.shrink { flex: 0 0 auto; }

        label {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.55);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        input:focus, select:focus {
            border-color: #e94560;
            background: rgba(255,255,255,0.1);
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) opacity(0.5);
        }

        select option {
            background: #16213e;
            color: #fff;
        }

        /* ── Профиль: логин ── */
        .profile-login {
            font-size: 20px;
            font-weight: 700;
            color: #e94560;
            padding: 4px 0 16px 0;
        }

        /* ── Счета ── */
        .accounts-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }

        .account-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            transition: border-color 0.2s;
            min-width: 160px;
        }

        .account-item:has(input:checked) {
            border-color: #e94560;
            background: rgba(233,69,96,0.1);
        }

        .account-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #e94560;
            flex-shrink: 0;
            padding: 0;
        }

        .account-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .account-currency {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }

        .account-value {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }

        /* ── Кнопки ── */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #c73652);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
        }

        /* ── Курсы валют ── */
        #exchange_rates table {
            width: 100%;
            border-collapse: collapse;
        }

        #exchange_rates th {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        #exchange_rates td {
            padding: 10px 10px;
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        #exchange_rates tr:last-child td { border-bottom: none; }

        #exchange_rates tr:hover td {
            background: rgba(255,255,255,0.03);
        }

        .rates-loading {
            color: rgba(255,255,255,0.35);
            font-size: 13px;
            padding: 8px 0;
        }
    </style>

    <script>
        setInterval(() => {
            var td = document.getElementById('exchange_rates');
            fetch('http://localhost:8081/api/rates')
                .then(response => response.json())
                .then(json => {
                    var table = '<table>';
                    table += '<tr><th>Валюта</th><th>Обозначение</th><th>Курс к рублю</th></tr>';
                    json.forEach(rate => {
                        table += '<tr>';
                        table += '<td>' + rate.title + '</td>';
                        table += '<td>' + rate.name + '</td>';
                        table += '<td>' + rate.value + '</td>';
                        table += '</tr>';
                    });
                    table += '</table>';
                    td.innerHTML = table;
                })
                .catch(error => td.innerHTML = '<p class="rates-loading">Ошибка при получении курсов валют</p>');
        }, 1000);
    </script>
</head>

<body>

<!-- Навбар -->
<nav class="navbar">
    <div class="navbar-brand">
        <div class="icon">🏦</div>
        BankApp
    </div>
    <div class="navbar-user">
        Привет, <span class="username" th:text="${login}">пользователь</span>
    </div>
    <div class="navbar-actions">
        <a href="/signup" class="btn-nav btn-outline">Регистрация +</a>
        <a href="/logout" class="btn-nav btn-danger">Выйти</a>
    </div>
</nav>

<div class="container">

    <!-- Смена пароля -->
    <div class="card">
        <div class="card-title"><div class="dot"></div> Профиль</div>
        <div class="profile-login" th:text="${login}"></div>
        <form method="post" th:action="${'/user/'+login+'/editPassword'}">
            <div class="error-list">
                <div class="error" th:if="${passwordErrors!=null}" th:each="passwordError : ${passwordErrors}" th:text="${passwordError}"></div>
            </div>
            <div class="row">
                <div class="field">
                    <label>Новый пароль</label>
                    <input name="password" type="password" placeholder="Введите новый пароль" required/>
                </div>
                <div class="field">
                    <label>Повторите пароль</label>
                    <input name="confirm_password" type="password" placeholder="Повторите пароль" required/>
                </div>
                <div class="field shrink">
                    <label>&nbsp;</label>
                    <button class="btn btn-primary" type="submit">Изменить пароль</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Данные и счета -->
    <div class="card">
        <div class="card-title"><div class="dot"></div> Личные данные и счета</div>
        <form method="post" th:action="${'/user/'+login+'/editUserAccounts'}">
            <div class="error-list">
                <div class="error" th:if="${userAccountsErrors!=null}" th:each="userAccountsError : ${userAccountsErrors}" th:text="${userAccountsError}"></div>
            </div>
            <div class="row" style="margin-bottom: 16px;">
                <div class="field">
                    <label>Фамилия Имя</label>
                    <input name="name" type="text" th:placeholder="${name}"/>
                </div>
                <div class="field">
                    <label>Дата рождения</label>
                    <input name="birthdate" type="date" th:value="${birthdate}"/>
                </div>
            </div>
            <label style="margin-bottom: 10px; display: block;">Счета</label>
            <div class="accounts-grid">
                <label class="account-item" th:each="account : ${accounts}">
                    <input name="account" type="checkbox"
                           th:checked="${account.isExists()}"
                           th:value="${account.getCurrency().name()}"/>
                    <div class="account-item-info">
                        <span class="account-currency" th:text="${account.getCurrency().getTitle()}"></span>
                        <span class="account-value"
                              th:text="${account.isExists() ? (account.getValue()+' '+account.getCurrency().name()) : 'Не открыт'}"></span>
                    </div>
                </label>
            </div>
            <div style="text-align: right; margin-top: 18px;">
                <button class="btn btn-primary" type="submit">Сохранить изменения</button>
            </div>
        </form>
    </div>

    <!-- Наличные -->
    <div class="card">
        <div class="card-title"><div class="dot"></div> Наличные</div>
        <form id="cashForm" method="post" th:action="${'/user/'+login+'/cash'}">
            <input type="hidden" name="idempotencyKey" th:value="${cashIdempotencyKey}"/>
            <input type="hidden" name="action" id="cashAction"/>
            <div class="error-list">
                <div class="error" th:if="${cashErrors!=null}" th:each="cashError : ${cashErrors}" th:text="${cashError}"></div>
            </div>
            <div class="row">
                <div class="field">
                    <label>Валюта</label>
                    <select name="currency">
                        <option th:each="eachCurrency : ${currency}" th:value="${eachCurrency.name()}" th:text="${eachCurrency.getTitle()}"/>
                    </select>
                </div>
                <div class="field">
                    <label>Сумма</label>
                    <input name="value" type="number" placeholder="0.00" required/>
                </div>
                <div class="field shrink">
                    <label>&nbsp;</label>
                    <div style="display:flex; gap:8px;">
                        <button type="button" class="btn btn-primary" onclick="document.getElementById('cashAction').value='PUT'; document.getElementById('cashForm').submit();">Положить</button>
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('cashAction').value='GET'; document.getElementById('cashForm').submit();">Снять</button>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- Перевод себе -->
    <div class="card">
        <div class="card-title"><div class="dot"></div> Перевод между своими счетами</div>
        <form method="post" th:action="${'/user/'+login+'/transfer'}" onsubmit="this.querySelectorAll('button').forEach(b=>b.disabled=true)">
            <input type="hidden" name="idempotencyKey" th:value="${selfTransferIdempotencyKey}"/>
            <div class="error-list">
                <div class="error" th:if="${transferErrors!=null}" th:each="transferError : ${transferErrors}" th:text="${transferError}"></div>
            </div>
            <div class="row">
                <div class="field">
                    <label>Со счёта</label>
                    <select name="from_currency">
                        <option th:each="eachCurrency : ${currency}" th:value="${eachCurrency.name()}" th:text="${eachCurrency.getTitle()}"/>
                    </select>
                </div>
                <div class="field">
                    <label>На счёт</label>
                    <select name="to_currency">
                        <option th:each="eachCurrency : ${currency}" th:value="${eachCurrency.name()}" th:text="${eachCurrency.getTitle()}"/>
                    </select>
                </div>
                <div class="field">
                    <label>Сумма</label>
                    <input name="value" type="number" placeholder="0.00" required/>
                </div>
                <div class="field shrink">
                    <label>&nbsp;</label>
                    <input hidden name="to_login" th:value="${login}"/>
                    <button class="btn btn-primary" type="submit">Перевести</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Перевод другому -->
    <div class="card">
        <div class="card-title"><div class="dot"></div> Перевод другому пользователю</div>
        <form method="post" th:action="${'/user/'+login+'/transfer'}" onsubmit="this.querySelectorAll('button').forEach(b=>b.disabled=true)">
            <input type="hidden" name="idempotencyKey" th:value="${otherTransferIdempotencyKey}"/>
            <div class="error-list">
                <div class="error" th:if="${transferOtherErrors!=null}" th:each="transferOtherError : ${transferOtherErrors}" th:text="${transferOtherError}"></div>
            </div>
            <div class="row">
                <div class="field">
                    <label>Со счёта</label>
                    <select name="from_currency">
                        <option th:each="eachCurrency : ${currency}" th:value="${eachCurrency.name()}" th:text="${eachCurrency.getTitle()}"/>
                    </select>
                </div>
                <div class="field">
                    <label>На счёт</label>
                    <select name="to_currency">
                        <option th:each="eachCurrency : ${currency}" th:value="${eachCurrency.name()}" th:text="${eachCurrency.getTitle()}"/>
                    </select>
                </div>
                <div class="field">
                    <label>Сумма</label>
                    <input name="value" type="number" placeholder="0.00" required/>
                </div>
                <div class="field">
                    <label>Получатель</label>
                    <select name="to_login">
                        <option th:each="user : ${users}" th:value="${user.getLogin()}" th:text="${user.getName()}"/>
                    </select>
                </div>
                <div class="field shrink">
                    <label>&nbsp;</label>
                    <button class="btn btn-primary" type="submit">Перевести</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Курсы валют -->
    <div class="card">
        <div class="card-title"><div class="dot"></div> Курсы валют к рублю</div>
        <div id="exchange_rates">
            <p class="rates-loading">Загрузка курсов валют...</p>
        </div>
    </div>

</div>
</body>
</html>
