spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    hikari:
      connection-init-sql: "CREATE SCHEMA IF NOT EXISTS accounts_service"
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: accounts_service
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: accounts_service
    liquibase-schema: public

management:
  zipkin:
    tracing:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 0
