spring:
  application:
    name: accounts-service

  kafka:
    bootstrap-servers: my-kafka.default.svc.cluster.local:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8081

  datasource:
    url: jdbc:postgresql://accounts-db-accounts-db:5432/accountsdb?currentSchema=accounts_service
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: accounts_service

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: accounts_service

logging:
  level:
    root: INFO
    org.springframework: DEBUG
    liquibase: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans  # эндпоинт Zipkin
  tracing:
    sampling:
      probability: 1  # трассируем 100% запросов