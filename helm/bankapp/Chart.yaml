apiVersion: v2
name: bankapp
description: A Helm chart for deploying the entire BankApp system, including multiple microservices
type: application
version: 1.0.0
appVersion: 1.0.0

# Зависимости чарта (sub-charts), которые будут установлены в рамках зонтичного Helm-чарта
dependencies:
  - name: accounts-service
    version: "1.0.0"
    repository: "file://./charts/accounts-service"
    dependsOn:
      - name: accounts-db
  - name: blocker-service
    version: "1.0.0"
    repository: "file://./charts/blocker-service"
  - name: cash-serviceйq
    version: "1.0.0"
    repository: "file://./charts/cash-service"
  - name: exchange-generator-service
    version: "1.0.0"
    repository: "file://./charts/exchange-generator-service"
  - name: exchange-service
    version: "1.0.0"
    repository: "file://./charts/exchange-service"
  - name: front-ui
    version: "1.0.0"
    repository: "file://./charts/front-ui"
  - name: notifications-service
    version: "1.0.0"
    repository: "file://./charts/notifications-service"
  - name: transfer-service
    version: "1.0.0"
    repository: "file://./charts/transfer-service"
  - name: keycloak
    version: "1.0.0"
    repository: "file://./charts/keycloak"

  # Базы данных
  - name: accounts-db
    version: "1.0.0"
    repository: "file://./accounts-db"  # Путь изменён, указывает на корень проекта
  - name: keycloak-db
    version: "1.0.0"
    repository: "file://./keycloak-db"  # Путь изменён, указывает на корень проекта