replicas: 2
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "2Gi"
volumeClaimTemplate:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 5Gi
esConfig:
  elasticsearch.yml: |
    xpack.security.http.ssl.enabled: false
    xpack.security.transport.ssl.enabled: false
extraEnvs:
  - name: ELASTIC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password
antiAffinity: "soft"
