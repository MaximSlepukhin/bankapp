replicaCount: 1

image:
  repository: docker.elastic.co/kibana/kibana
  tag: 8.10.0
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

service:
  type: ClusterIP
  port: 5601

elasticsearchHosts: "http://elasticsearch-master.monitoring.svc.cluster.local:9200"
