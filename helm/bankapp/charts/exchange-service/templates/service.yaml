apiVersion: v1
kind: Service
metadata:
  name: {{ include "exchange-service.fullname" . }}
  labels:
    app.kubernetes.io/name: exchange-service
spec:
  selector:
    app: {{ include "exchange-service.name" . }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: {{ .Values.service.type }}