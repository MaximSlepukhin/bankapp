springProfile: dev

replicaCount: 1

image:
  repository: exchange-generator-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080
  labels:
    app.kubernetes.io/name: exchange-generator-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8080"

resources:
  requests:
    memory: "100Mi"
    cpu: "100m"
  limits:
    memory: "200Mi"
    cpu: "200m"

env:
  SPRING_PROFILES_ACTIVE: dev
  EXCHANGE_SERVICE_URL: "http://exchange-service:8084/api/exchange/rates"
