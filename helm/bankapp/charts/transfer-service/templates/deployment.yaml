apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "transfer-service.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "transfer-service.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "transfer-service.name" . }}
    spec:
      containers:
        - name: transfer-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.env.SPRING_PROFILES_ACTIVE }}"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.env.POSTGRES_HOST }}:{{ .Values.env.POSTGRES_PORT }}/{{ .Values.env.POSTGRES_DATABASE }}?currentSchema={{ .Values.env.POSTGRES_SCHEMA }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{ .Values.env.POSTGRES_USERNAME }}"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "{{ .Values.env.POSTGRES_PASSWORD }}"
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "transfer-service.fullname" . }}-secret
                  key: KEYCLOAK_CLIENTSECRET
            - name: SPRING_CLOUD_CONFIG_ENABLED
              value: "false"
