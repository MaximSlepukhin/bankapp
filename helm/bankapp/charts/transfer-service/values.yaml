apiVersion: v2
name: transfer-service
description: Transfer Service Helm Chart
type: application
version: 1.0.0
appVersion: "1.0.0"

replicaCount: 1

image:
  repository: transfer-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8083

env:
  SPRING_PROFILES_ACTIVE: "dev"

  POSTGRES_HOST: "accounts-db-accounts-db.default.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "accountsdb"
  POSTGRES_USERNAME: "accounts_user"
  POSTGRES_PASSWORD: "strongpassword123"
  POSTGRES_SCHEMA: "transfer_service"

keycloak:
  realm: bank-realm
  url: http://keycloak:8080
  clientSecret: "replace-me"

resources: {}
secrets:
  KEYCLOAK_CLIENTSECRET: "replace-me"
