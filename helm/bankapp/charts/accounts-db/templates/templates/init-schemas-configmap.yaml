apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "accounts-db.fullname" . }}-init-schemas
data:
  init-schemas.sql: |
    CREATE SCHEMA IF NOT EXISTS accounts_service;
    CREATE SCHEMA IF NOT EXISTS cash_service;
    CREATE SCHEMA IF NOT EXISTS transfer_service;
    CREATE SCHEMA IF NOT EXISTS exchange_service;
    CREATE SCHEMA IF NOT EXISTS exchange_generator_service;
    CREATE SCHEMA IF NOT EXISTS blocker_service;
    CREATE SCHEMA IF NOT EXISTS notifications_service;
