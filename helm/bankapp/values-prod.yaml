blocker-service:
  replicaCount: 3
  image:
    repository: blocker-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  env:
    maintenanceStart: "02:00"
    maintenanceEnd: "02:15"
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"













# values-prod.yaml
springProfile: prod

image:
  repository: exchange-generator-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi
