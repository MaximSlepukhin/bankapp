# Все базы данных выключаем, чтобы Helm их не трогал
accounts-db:
  enabled: false
keycloak-db:
  enabled: false

accounts-service:
  enabled: false
  image:
    repository: accounts-service
    tag: latest
    pullPolicy: IfNotPresent

blocker-service:
  enabled: false
  replicaCount: 1
  image:
    repository: blocker-service
    tag: latest
    pullPolicy: IfNotPresent

cash-service:
  enabled: false
  image:
    repository: cash-service
    tag: latest
    pullPolicy: IfNotPresent

exchange-generator-service:
  enabled: false
  image:
    repository: exchange-generator-service
    tag: latest
    pullPolicy: IfNotPresent

exchange-service:
  enabled: false
  image:
    repository: exchange-service
    tag: latest
    pullPolicy: IfNotPresent

front-ui:
  enabled: false
  image:
    repository: front-ui
    tag: latest
    pullPolicy: IfNotPresent

notifications-service:
  enabled: false
  image:
    repository: notifications-service
    tag: latest
    pullPolicy: IfNotPresent

transfer-service:
  enabled: false
  image:
    repository: transfer-service
    tag: latest
    pullPolicy: IfNotPresent