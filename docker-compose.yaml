version: '3.8'
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock               # доступ к docker daemon хоста
      - /Users/maksim/.kube:/var/jenkins_home/.kube:ro          # kubeconfig из хоста в контейнер
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

volumes:
  jenkins_home: