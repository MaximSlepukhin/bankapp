services:
  # --- PostgreSQL для банковских сервисов ---
  postgres:
    image: postgres:15-alpine
    container_name: postgres-bank
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  # --- PostgreSQL для Keycloak ---
  postgres-keycloak:
    image: postgres:15-alpine
    container_name: postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5434:5432"
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data

  # --- Keycloak ---
#  keycloak:
#    image: quay.io/keycloak/keycloak:24.0.4
#    container_name: keycloak
#    restart: unless-stopped
#    command: start-dev --http-port=8080
#    environment:
#      KC_DB: postgres
#      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
#      KC_DB_USERNAME: keycloak
#      KC_DB_PASSWORD: keycloak
#      KC_HOSTNAME_STRICT: false
#      KC_HOSTNAME_STRICT_HTTPS: false
#      KC_HOSTNAME_URL: http://localhost:8082
#      KEYCLOAK_ADMIN: admin
#      KEYCLOAK_ADMIN_PASSWORD: admin
#      KC_LOG_LEVEL: trace
#    ports:
#      - "8082:8080"
#    depends_on:
#      - postgres-keycloak

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    restart: unless-stopped
    command: start-dev --http-port=8080 --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HOSTNAME_URL: http://localhost:8082
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_LOG_LEVEL: trace
    ports:
      - "8082:8080"
    depends_on:
      - postgres-keycloak
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
      - ./keycloak-export:/opt/keycloak/data/import

  # --- Discovery server ---
  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- Accounts Service ---
  accounts-service:
    build:
      context: .
      dockerfile: accounts-service/Dockerfile
    container_name: accounts-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankdb
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    depends_on:
      - postgres
      - discovery-server
      - keycloak

  # --- Cash Service ---
  cash-service:
    build:
      context: .
      dockerfile: cash-service/Dockerfile
    container_name: cash-service
    ports:
      - "8091:8091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankdb
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    depends_on:
      - postgres
      - discovery-server
      - keycloak

  # --- Transfer Service ---
  transfer-service:
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
    container_name: transfer-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankdb
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    depends_on:
      - postgres
      - discovery-server
      - keycloak

  # --- Exchange Service ---
  exchange-service:
    build:
      context: .
      dockerfile: exchange-service/Dockerfile
    container_name: exchange-service
    ports:
      - "8085:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankdb
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    depends_on:
      - postgres
      - discovery-server
      - keycloak

  # --- Blocker Service ---
  blocker-service:
    build:
      context: .
      dockerfile: blocker-service/Dockerfile
    container_name: blocker-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankdb
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    depends_on:
      - postgres
      - discovery-server
      - keycloak

  # --- Notifications Service ---
  notifications-service:
    build:
      context: .
      dockerfile: notifications-service/Dockerfile
    container_name: notifications-service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bankdb
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: bankpass
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    depends_on:
      - postgres
      - discovery-server
      - keycloak

  # --- Exchange Generator Service ---
  exchange-generator-service:
    build:
      context: .
      dockerfile: exchange-generator-service/Dockerfile
    container_name: exchange-generator-service
    ports:
      - "8088:8088"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    depends_on:
      - discovery-server
      - keycloak

  # --- Front UI ---
  front-ui:
    build:
      context: .
      dockerfile: front-ui/Dockerfile
    container_name: front-ui
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - KEYCLOAK_EXTERNAL_URL=http://localhost:8082
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005  # ✅ JVM debug
#      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      - discovery-server
      - keycloak

  # --- Gateway ---
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    ports:
      - "8090:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    depends_on:
      - accounts-service
      - cash-service
      - transfer-service
      - exchange-service
      - blocker-service
      - notifications-service
      - front-ui
      - discovery-server
      - exchange-generator-service
      - keycloak

  # --- Config Server ---
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: file:/config-repo
    volumes:
      - ./config-repo:/config-repo
#    depends_on:
#      - discovery-server

volumes:
  postgres-data:
  postgres-keycloak-data: