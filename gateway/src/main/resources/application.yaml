eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-server:8761/eureka/

logging:
  level:
    root: info
    org.springframework.security: trace
    org.springframework.web: debug
    org.springframework.cloud.gateway: trace
    reactor.netty.http.client: debug
    org.springframework.web.reactive.function.client: debug
    org.springframework.web.reactive.function.client.ExchangeFunctions: DEBUG
    org.springframework.web.reactive.function.client.ExchangeFilterFunctions: DEBUG
    org.springframework.cloud.gateway.filter: DEBUG
    org.springframework.security.oauth2.client.web.reactive.function.client: DEBUG
    org.springframework.security.oauth2: TRACE
    org.springframework.security.web.authentication: TRACE
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: TRACE
