server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: accounts-service
          uri: lb://ACCOUNTS-SERVICE
          predicates:
            - Path=/accounts-service/**
        - id: cash-service
          uri: lb://CASH-SERVICE
          predicates:
            - Path=/cash-service/**
        - id: transfer-service
          uri: lb://TRANSFER-SERVICE
          predicates:
            - Path=/transfer-service/**
        - id: exchange-service
          uri: lb://EXCHANGE-SERVICE
          predicates:
            - Path=/exchange-service/**
        - id: blocker-service
          uri: lb://BLOCKER-SERVICE
          predicates:
            - Path=/blocker-service/**
        - id: notifications-service
          uri: lb://NOTIFICATIONS-SERVICE
          predicates:
            - Path=/notifications-service/**
        - id: front-ui
          uri: lb://FRONT-UI
          predicates:
            - Path=/front-ui/**
      default-filters:
        - StripPrefix=1
        # ⬇️ Добавляем фильтр, чтобы проксировать Authorization-заголовок
        - name: PreserveHostHeader

  security:
    oauth2:
      resourceserver:
        jwt:
          # Можно использовать jwk-set-uri, чтобы избежать проверки issuer
          jwk-set-uri: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/certs
      client:
        registration:
          keycloak-service:
            provider: keycloak
            client-id: front-ui-service
            client-secret: z1GkjE1Vi9Ba1B91tFPjZtg6CGQiw5ea
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://keycloak:8080/realms/bank-realm/protocol/openid-connect/token
