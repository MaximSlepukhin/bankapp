# Контракт: blocker-service блокирует подозрительного пользователя.
# HTTP 403 — часть контракта. Потребитель должен это обрабатывать.

description: "Возвращает 403 и blocked=true для подозрительного пользователя"

request:
  method: POST
  url: /api/v1/blocker/check
  headers:
    Content-Type: application/json
  body:
    login: blocked_user
  matchers:
    body:
      - path: $.login
        type: by_equality

response:
  status: 403
  headers:
    Content-Type: application/json
  body:
    blocked: true
    reason: "Подозрительная активность"
