databaseChangeLog:
  - changeSet:
      id: 001
      author: maxims
      changes:
        - createTable:
            schemaName: notifications_service   # 👈 добавь эту строку!
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: login
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
  - changeSet:
      id: 002-add-message-id-to-notifications
      author: maksim
      changes:
        - addColumn:
            schemaName: notifications_service
            tableName: notifications
            columns:
              - column:
                  name: message_id
                  type: VARCHAR(100)
        - addUniqueConstraint:
            schemaName: notifications_service
            tableName: notifications
            columnNames: message_id
            constraintName: uq_notifications_message_id
