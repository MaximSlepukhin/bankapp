spring:
  application:
    name: notifications-service

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.default_schema: notifications_service

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/notifications-service/master.yaml
    default-schema: notifications_service
    drop-first: true
    clear-checksums: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:80/realms/bank-realm/protocol/openid-connect/certs

logging:
  level:
    root: info
    org.springframework.security: trace
    org.springframework.web: debug
    org.springframework.security.oauth2: trace
    org.springframework.jdbc.core: debug
    org.springframework.jdbc.datasource: debug
    org.springframework.boot.jdbc.DataSourceInitializer: debug
    org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration: debug

