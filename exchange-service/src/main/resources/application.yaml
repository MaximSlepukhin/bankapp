spring:
  application:
    name: exchange-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:80/realms/bank-realm
          jwk-set-uri: http://keycloak:80/realms/bank-realm/protocol/openid-connect/certs

  kafka:
    bootstrap-servers: my-kafka.default.svc.cluster.local:9092
    consumer:
      group-id: exchange-service-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.github.maximslepukhin.model.dto"


server:
  port: 8084
  address: 0.0.0.0

logging:
  level:
    root: info
    org.springframework.security: trace
    org.springframework.web: debug
    org.springframework.security.oauth2: trace

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

  metrics:
    enable:
      all: true

  tracing:
    sampling:
      probability: 1

  zipkin:
    tracing:
      endpoint: http://zipkin.monitoring.svc.cluster.local:9411/api/v2/spans